name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build AzelaSIA.exe
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "AzelaSIA" --add-data "web;web" --hidden-import "openpyxl" main.py
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: AzelaSIA-Windows
          path: dist/AzelaSIA.exe

